version: 2
ethernets:
  eth0:
    match:
      macaddress: "${mac_address}"
    set-name: eth0
    dhcp4: false
    addresses:
      - ${ip_address}/${cidr_prefix}
    routes:
      - to: default
        via: ${gateway_address}
    nameservers:
      addresses:
        - ${gateway_address}
        - 1.1.1.1
      search:
        - ${domain}
