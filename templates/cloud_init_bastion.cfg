#cloud-config
# ==============================================================================
# Helper-Bastion VM Cloud-Init Configuration (Rocky Linux 9 / RHEL)
# ==============================================================================

hostname: ${hostname}
fqdn: ${hostname}.${domain}
manage_etc_hosts: true

users:
  - name: ${admin_username}
    gecos: "Lab Administrator"
    groups: [wheel, adm, systemd-journal]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${ssh_public_key}

# Deterministic SSH Host Keys (enforces StrictHostKeyChecking=yes, eliminates MITM risks)
ssh_keys:
  ed25519_private: |
${indent(4, bastion_host_key_priv)}
  ed25519_public: ${bastion_host_key_pub}

ssh_pwauth: true
disable_root: false

package_update: true
packages:
  - epel-release
  - curl
  - wget
  - tar
  - jq
  - tmux
  - git
  - bind-utils
  - net-tools
  - iproute
  - firewalld
  - dnsmasq
  - haproxy
  - python3
  - python3-pip

runcmd:
  # Enable firewalld and configure standard ports
  - systemctl enable --now firewalld || true
  - firewall-cmd --permanent --add-service=ssh || true
  - firewall-cmd --permanent --add-service=dns || true
  - firewall-cmd --permanent --add-service=http || true
  - firewall-cmd --permanent --add-service=https || true
  - firewall-cmd --permanent --add-port=6443/tcp || true
  - firewall-cmd --permanent --add-port=22623/tcp || true
  - firewall-cmd --permanent --add-port=9000/tcp || true
  - firewall-cmd --reload || true
  # Permit HAProxy to bind/connect freely under SELinux
  - setsebool -P haproxy_connect_any 1 || true

final_message: "OpenShift Helper-Bastion VM bootstrap complete after $UPTIME seconds"
