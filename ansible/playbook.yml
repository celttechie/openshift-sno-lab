---
# ==============================================================================
# Helper-Bastion Provisioning Playbook for OpenShift SNO Lab
# Configures dnsmasq split-DNS, haproxy ingress/API routing, and OCP CLI tools
# ==============================================================================

- name: Provision OpenShift Helper-Bastion VM
  hosts: bastion
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for Bastion SSH to become responsive
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

    - name: Gather host facts
      ansible.builtin.setup:

  roles:
    - common
    - dnsmasq
    - haproxy
    - ocp_tools
