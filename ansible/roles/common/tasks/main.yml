---
- name: Install EPEL release repository
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install core administrative and network diagnostic tools
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - tar
      - jq
      - tmux
      - git
      - bind-utils
      - net-tools
      - iproute
      - firewalld
      - python3
      - python3-pip
      - bash-completion
    state: present
    update_cache: true

- name: Ensure firewalld service is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow SSH service through firewalld
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: true
